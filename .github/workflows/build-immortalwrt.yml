name: Build ImmortalWrt RPi3

on:
  workflow_dispatch:
    inputs:
      mirror:
        description: Download source
        required: true
        default: official
        type: choice
        options:
          - official
          - zju
      flow_offloading:
        description: Flow offloading mode
        required: true
        default: disabled
        type: choice
        options:
          - disabled
          - software
          - hardware

permissions:
  contents: read

concurrency:
  group: immortalwrt-rpi3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build 24.10.6 for Raspberry Pi 3
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync swig \
            unzip zlib1g-dev file wget curl zstd ca-certificates

      - name: Show runner resources
        run: |
          nproc
          free -h
          df -h

      - name: Build custom IPKs and firmware
        env:
          IWRT_SOURCE_MIRROR: ${{ inputs.mirror }}
          FLOW_OFFLOADING: ${{ inputs.flow_offloading }}
        run: bash scripts/build.sh

      - name: Upload firmware and IPKs
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-rpi3-24.10.6
          path: output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
